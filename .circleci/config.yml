version: 2.1

jobs:
  test:
    docker:
      # Primary container: every step runs here.
      - image: cimg/python:3.14
        environment:
          DATABASE_URL: postgresql://postgres@localhost/circle_test
      # Service container: PostgreSQL, reachable on localhost.
      - image: cimg/postgres:18.6
        environment:
          POSTGRES_USER: postgres
    steps:
      - checkout
      - restore_cache:
          keys:
            - pip-cache-v1-{{ .Branch }}-{{ checksum "requirements.txt" }}
            - pip-cache-v1-{{ .Branch }}-
            - pip-cache-v1-
      - run:
          name: Install dependencies
          command: pip install -r requirements.txt
      - save_cache:
          key: pip-cache-v1-{{ .Branch }}-{{ checksum "requirements.txt" }}
          paths:
            - ~/.cache/pip
      - run:
          name: Wait for PostgreSQL
          command: dockerize -wait tcp://localhost:5432 -timeout 1m
      - run:
          name: Run tests
          command: pytest --junitxml=test-results/junit.xml
      - store_test_results:
          path: test-results

workflows:
  build-and-test:
    jobs:
      - test
